<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap" rel="stylesheet">

    <title>AMIÉ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="mobile-page">

    <!-- HEADER -->
    <header class="header">
        <button class="menu">☰</button>

        <div class="logo">AMIÉ</div>

        <button class="cart">♧</button>
    </header>


    <!-- HERO -->
    <section class="hero">
        <img src="images/hero.jpg" alt="AMIÉ furniture">
    </section>


    <!-- BEST ITEMS -->
    <section class="best-items">

        <h2>BEST ITEMS</h2>

        <div class="best-grid">

            <article class="item">
                <img src="images/item1.jpg" alt="">
            </article>

            <article class="item">
                <img src="images/item2.jpg" alt="">
            </article>

            <article class="item">
                <img src="images/item3.jpg" alt="">
            </article>

            <article class="item">
                <img src="images/item4.jpg" alt="">
            </article>

        </div>

    </section>


    <!-- BRAND / LARGE IMAGE -->
    <section class="brand-image">
        <img src="images/brand.jpg" alt="">
    </section>


    <!-- FOR CAT -->
    <section class="for-cat">

        <h2>FOR CAT</h2>

        <div class="cat-image">
            <img src="images/cat.jpg" alt="">
        </div>

    </section>


    <!-- REVIEWS -->
    <section class="reviews">

        <h2>REVIEWS</h2>

        <div class="review-slider">

            <article class="review-card">
                <img src="images/review1.jpg" alt="">
            </article>

            <article class="review-card">
                <img src="images/review2.jpg" alt="">
            </article>

            <article class="review-card">
                <img src="images/review3.jpg" alt="">
            </article>

        </div>

    </section>

</div>

</body>
</html>
