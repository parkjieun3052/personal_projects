<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Zeyada 폰트 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap"
        rel="stylesheet"
    >

    <title>AMIÉ</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="mobile-page">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <!-- 메뉴 버튼 -->
        <button
            class="menu"
            id="menuButton"
            aria-label="메뉴 열기"
        >
            ☰
        </button>


        <!-- 중앙 로고 (텍스트, Zeyada 폰트, 클릭 비활성) -->
        <div class="logo" aria-hidden="true">AMIÉ</div>


        <!-- 장바구니 -->
        <a
            href="cart.html"
            class="cart"
            aria-label="장바구니"
        >
            <img
                src="images/cart.svg"
                alt="장바구니"
            >
        </a>

    </header>



    <!-- =========================
         MENU
         메인페이지 위에 펼쳐지는 메뉴
    ========================== -->

    <nav
        class="menu-window"
        id="menuWindow"
    >

        <!-- 메뉴 닫기 -->
        <button
            class="menu-close"
            id="menuClose"
            aria-label="메뉴 닫기"
        >
            ×
        </button>


        <!-- 메뉴 항목 -->

        <a href="new.html">
            NEW
        </a>

        <a href="all-product.html">
            ALL PRODUCT
        </a>

        <a href="cat-collection.html">
            CAT COLLECTION
        </a>

        <a href="furniture.html">
            FURNITURE
        </a>

        <a href="fabric.html">
            FABRIC
        </a>

        <a href="mypage.html">
            MY PAGE
        </a>

    </nav>



    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <a href="all-product.html">

            <img
                src="images/hero.jpg"
                alt="AMIÉ furniture"
            >

        </a>

    </section>



    <!-- =========================
         BEST ITEMS
    ========================== -->

    <section class="best-items">

        <h2>BEST ITEMS</h2>


        <div class="best-grid">


            <!-- 상품 1 -->

            <a
                href="product.html"
                class="item"
            >

                <img
                    src="images/item1.jpg"
                    alt="상품 1"
                >

            </a>



            <!-- 상품 2 -->

            <a
                href="product.html"
                class="item"
            >

                <img
                    src="images/item2.jpg"
                    alt="상품 2"
                >

            </a>



            <!-- 상품 3 -->

            <a
                href="product.html"
                class="item"
            >

                <img
                    src="images/item3.jpg"
                    alt="상품 3"
                >

            </a>



            <!-- 상품 4 -->

            <a
                href="product.html"
                class="item"
            >

                <img
                    src="images/item4.jpg"
                    alt="상품 4"
                >

            </a>

        </div>

    </section>



    <!-- =========================
         BRAND IMAGE
    ========================== -->

    <section class="brand-image">

        <a href="about.html">

            <img
                src="images/brand.jpg"
                alt="AMIÉ brand"
            >

        </a>

    </section>



    <!-- =========================
         FOR CAT
    ========================== -->

    <section class="for-cat">

        <h2>FOR CAT</h2>


        <a
            href="cat-collection.html"
            class="cat-image"
        >

            <img
                src="images/cat.jpg"
                alt="Cat Collection"
            >

        </a>

    </section>



    <!-- =========================
         REVIEWS
    ========================== -->

    <section class="reviews">

        <h2>REVIEWS</h2>


        <div class="review-slider">


            <!-- 리뷰 1 -->

            <article class="review-card">

                <img
                    src="images/review1.jpg"
                    alt="Review 1"
                >

            </article>



            <!-- 리뷰 2 -->

            <article class="review-card">

                <img
                    src="images/review2.jpg"
                    alt="Review 2"
                >

            </article>



            <!-- 리뷰 3 -->

            <article class="review-card">

                <img
                    src="images/review3.jpg"
                    alt="Review 3"
                >

            </article>


        </div>

    </section>


</div>



<!-- =========================
     JS
========================= -->

<script src="menu.js"></script>

</body>

</html>
