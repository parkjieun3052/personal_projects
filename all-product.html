<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap" rel="stylesheet">
    <title>ALL PRODUCT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="mobile-page">
        <header class="header">
            <button class="menu" id="menuButton" aria-label="메뉴 열기">☰</button>
            <div class="logo" aria-hidden="true">AMIÉ</div>
            <a href="cart.html" class="cart" aria-label="장바구니">
                <img src="images/cart.svg" alt="장바구니">
            </a>
        </header>

        <nav class="menu-window" id="menuWindow">
            <button class="menu-close" id="menuClose" aria-label="메뉴 닫기">×</button>
            <a href="all-product.html?category=new">NEW</a>
            <a href="all-product.html?category=all">ALL PRODUCT</a>
            <a href="all-product.html?category=cat">CAT COLLECTION</a>
            <a href="all-product.html?category=furniture">FURNITURE</a>
            <a href="index.html">HOME</a>
        </nav>

        <main class="catalog-page">
            <div class="catalog-shell">
                <div class="catalog-hero">
                    <h1>Collection</h1>
                </div>

                <div class="catalog-controls">
                    <button class="filter-btn" data-category="all">ALL</button>
                    <button class="filter-btn" data-category="new">NEW</button>
                    <button class="filter-btn" data-category="cat">CAT COLLECTION</button>
                    <button class="filter-btn" data-category="furniture">FURNITURE</button>
                </div>

                <section class="catalog-grid" id="catalogGrid"></section>
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script src="catalog.js"></script>
</body>

</html>
